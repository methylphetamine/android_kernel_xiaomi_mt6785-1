name: Build Kernel

on:
  push:
    branches: [ fifteen ]
  pull_request:
    branches: [ fifteen ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Kernel
        run: |
          echo "Build workflow started"
          if [ -d "/opt/android-ndk-r25b/toolchains/llvm/prebuilt/linux-x86_64/bin" ]; then
            echo "NDK found, setting up PATH"
            export PATH=/opt/android-ndk-r25b/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          else
            echo "NDK not found - attempting to install"
            wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip -O ndk.zip || wget -q https://mirrors.edge.kernel.org/google/android/repository/android-ndk-r25b-linux.zip -O ndk.zip
            unzip -q ndk.zip -d /opt
            export PATH=/opt/android-ndk-r25b/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          fi
          echo "PATH=$PATH"
          make begonia_user_defconfig ARCH=arm64 CC=aarch64-linux-android-clang CLANG_TRIPLE=aarch64-linux-android- LLVM=1 2>&1 | tail -5 || true
          scripts/config --disable COMPAT 2>/dev/null || true
          scripts/config --disable CC_STACKPROTECTOR_STRONG 2>/dev/null || true
          scripts/config --disable CC_STACKPROTECTOR 2>/dev/null || true
          make olddefconfig ARCH=arm64 CC=aarch64-linux-android-clang CLANG_TRIPLE=aarch64-linux-android- LLVM=1 2>&1 | tail -5
          make -j$(nproc) Image.gz ARCH=arm64 CC=aarch64-linux-android-clang CLANG_TRIPLE=aarch64-linux-android- LLVM=1 EXTRA_CFLAGS="-mcpu=cortex-a55" 2>&1
          ls -la arch/arm64/boot/

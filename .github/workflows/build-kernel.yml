name: Build MT6785 Kernel

on:
  workflow_dispatch:
  push:
    branches: [ fifteen ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: fifteen

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev \
            libncursesw5-dev xz-utils tar curl wget git make gcc g++ libelf-dev

      - name: Install cross-compilers
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu gcc-arm-linux-gnueabihf
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=arm-linux-gnueabihf-" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV

      - name: Generate kernel config
        run: |
          make begonia_user_defconfig ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- 2>&1 | tail -10 || \
          make olddefconfig ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- 2>&1 | tail -10
          scripts/config --disable COMPAT 2>/dev/null || true
          make olddefconfig ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- 2>&1 | tail -5

      - name: Build kernel Image.gz
        run: |
          make -j$(nproc) Image.gz ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- 2>&1 | tail -30

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image-gz
          path: arch/arm64/boot/Image.gz
          retention-days: 7

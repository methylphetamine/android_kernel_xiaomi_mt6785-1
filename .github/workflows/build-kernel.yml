name: Build Kernel (Correct Toolchain)

on:
  push:
    branches: [ fifteen ]
  pull_request:
    branches: [ fifteen ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip git gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Install ARM Toolchain
        run: |
          # Install the GNU binutils (ld) for aarch64-linux-gnu
          sudo apt-get install -y g++-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Setup Kernel Build Environment
        run: |
          # Create build directory
          mkdir -p build
          cd build
          
          # Initialize kernel source (already checked out)
          echo "Kernel source ready for MT6785 build"

      - name: Build Kernel
        run: |
          cd /tmp/kernel_fix
          echo "Starting MT6785 kernel build with the correct toolchain..."
          
          # Use system gcc for cross-compilation (standard Linux toolchain)
          # The kernel Makefile expects gcc with aarch64-linux-gnu-* prefixes
          export CC=aarch64-linux-gnu-gcc
          export AR=aarch64-linux-gnu-ar
          export LD=aarch64-linux-gnu-ld
          export AS=aarch64-linux-gnu-as
          export NM=aarch64-linux-gnu-nm
          
          echo "Using cross-compiler: $CC"
          echo "GCC version: $($CC --version | head -1)"
          
          # Verify the cross-compiler supports aarch64-linux-gnu
          if ! $CC --target=aarch64-linux-gnu -v >/dev/null 2>&1; then
            echo "ERROR: Cross-compiler does not support aarch64-linux-gnu target"
            echo "This is required for MT6785 kernel build"
            exit 1
          fi
          
          echo "✅ Cross-compiler verified successfully"
          
          # Run the build script
          ./build.sh

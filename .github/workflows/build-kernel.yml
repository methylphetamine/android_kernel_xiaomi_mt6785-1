name: Build Kernel

on:
  push:
    branches: [ fifteen ]
  pull_request:
    branches: [ fifteen ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf clang

      - name: Generate kernel config
        run: |
          sed -i 's/^CONFIG_VDSO=.*/CONFIG_VDSO=n/' arch/arm64/configs/begonia_user_defconfig 2>/dev/null || true
          grep -q '^CONFIG_VDSO=' arch/arm64/configs/begonia_user_defconfig || echo 'CONFIG_VDSO=n' >> arch/arm64/configs/begonia_user_defconfig
          sed -i 's/^CONFIG_VDSO32=.*/CONFIG_VDSO32=n/' arch/arm64/configs/begonia_user_defconfig 2>/dev/null || true
          grep -q '^CONFIG_VDSO32=' arch/arm64/configs/begonia_user_defconfig || echo 'CONFIG_VDSO32=n' >> arch/arm64/configs/begonia_user_defconfig
          sed -i '/vdso/d' arch/arm64/Makefile
          rm -rf arch/arm64/kernel/vdso
          mkdir -p arch/arm64/kernel/vdso
          echo 'obj-y :=' > arch/arm64/kernel/vdso/Makefile
          echo 'obj-m :=' >> arch/arm64/kernel/vdso/Makefile
          make begonia_user_defconfig ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-android- LLVM=1 2>&1 | tail -5 || true
          scripts/config --disable COMPAT 2>/dev/null || true
          scripts/config --disable CC_STACKPROTECTOR_STRONG 2>/dev/null || true
          scripts/config --disable CC_STACKPROTECTOR 2>/dev/null || true
          make olddefconfig ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-android- LLVM=1 2>&1 | tail -5

      - name: Build kernel Image.gz
        run: |
          make -j$(nproc) Image.gz ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-android- LLVM=1 EXTRA_CFLAGS="-mcpu=cortex-a55" 2>&1
          ls -la arch/arm64/boot/

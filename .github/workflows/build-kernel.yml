name: Build Kernel (Final Solution - Clang 15)

on:
  push:
    branches: [ fifteen ]
  pull_request:
    branches: [ fifteen ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip git wget lld bc build-essential flex bison libssl-dev libncurses-dev libelf-dev

      - name: Install Clang 15
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-15 main"
          sudo apt-get update
          sudo apt-get install -y clang-15 lld-15 llvm-15 lld-15-tools
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-15 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-15 100
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-15 100

      - name: Verify Toolchain
        run: |
          echo "Installed clang version:"
          clang-15 --version | head -1
          echo ""
          echo "Installed lld version:"
          lld-15 --version | head -1

      - name: Setup build cache
        uses: actions/cache@v4
        with:
          path: |
            build
            arch/arm64/boot/
          key: kernel-build-${{ github.sha }}
          restore-keys: |
            kernel-build-

      - name: Build Kernel
        run: |
          echo "Starting MT6785 kernel build with Clang 15..."
          echo "Using clang: $(which clang-15)"
          echo "Clang version: $(clang-15 --version | head -1)"
          
          # Set up environment with Clang 15
          export CC="clang-15"
          export CXX="clang++-15"
          export AR="llvm-ar-15"
          export NM="llvm-nm-15"
          export OBJCOPY="llvm-objcopy-15"
          export OBJDUMP="llvm-objdump-15"
          export STRIP="llvm-strip-15"
          export LD="ld.lld-15"
          
          # Run the build script
          ./build.sh

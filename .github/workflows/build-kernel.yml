name: Build Kernel (Final Working Solution)

on:
  push:
    branches: [ fifteen ]
  pull_request:
    branches: [ fifteen ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip git gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Install Linux Cross-Compiler
        run: |
          # Install standard Linux cross-compiler that supports aarch64-linux-gnu
          # This is the standard Ubuntu package for MT6785 kernel build
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu-gcc \
            gcc-aarch64-linux-gnu-g++ \
            gcc-aarch64-linux-gnu-ld \
            gcc-aarch64-linux-gnu-as \
            gcc-aarch64-linux-gnu-nm

      - name: Verify Toolchain
        run: |
          # Verify the installed cross-compiler
          echo "Installed cross-compiler version:"
          aarch64-linux-gnu-gcc --version | head -1
          echo ""
          
          # Test aarch64-linux-gnu target support
          echo "Testing aarch64-linux-gnu target support..."
          if ! aarch64-linux-gnu-gcc --target=aarch64-linux-gnu -v >/dev/null 2>&1; then
            echo "ERROR: Cross-compiler does not support aarch64-linux-gnu target"
            echo "This is required for MT6785 kernel build"
            exit 1
          fi
          
          echo "✅ Cross-compiler verified successfully"
          echo "Cross-compiler supports aarch64-linux-gnu target"

      - name: Setup build cache
        uses: actions/cache@v4
        with:
          path: |
            build
            arch/arm64/boot/
          key: kernel-build-${{ github.sha }}
          restore-keys: |
            kernel-build-

      - name: Build Kernel
        run: |
          cd /tmp/kernel_fix
          echo "Starting MT6785 kernel build with verified toolchain..."
          echo "Using cross-compiler: $(which aarch64-linux-gnu-gcc)"
          echo "Cross-compiler version: $(aarch64-linux-gnu-gcc --version | head -1)"
          
          # Set up environment with correct toolchain
          export CC="aarch64-linux-gnu-gcc"
          export CXX="aarch64-linux-gnu-g++"
          export AR="aarch64-linux-gnu-ar"
          export LD="aarch64-linux-gnu-ld"
          export AS="aarch64-linux-gnu-as"
          export NM="aarch64-linux-gnu-nm"
          
          # Run the build script
          ./build.sh

name: Build MT6785 Kernel

on:
  workflow_dispatch:
  push:
    branches: [ fifteen ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: fifteen

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev \
            libncursesw5-dev xz-utils tar curl wget git make gcc g++ libelf-dev \
            python3 python3-pip rsync

      - name: Download Android NDK (contains clang)
        run: |
          cd /tmp
          wget -q https://dl.google.com/android/repository/android-ndk-r27b-linux.zip -O ndk.zip
          unzip -q ndk.zip -d /opt
          echo "NDK=/opt/android-ndk-r27b" >> $GITHUB_ENV
          echo "CLANG_PATH=/opt/android-ndk-r27b/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_ENV
          echo "/opt/android-ndk-r27b/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Generate kernel config
        run: |
          make begonia_user_defconfig ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 2>&1 | tail -5 || true
          scripts/config --disable COMPAT 2>/dev/null || true
          scripts/config --disable CC_STACKPROTECTOR_STRONG 2>/dev/null || true
          scripts/config --disable CC_STACKPROTECTOR 2>/dev/null || true
          make olddefconfig ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 2>&1 | tail -5
          echo "CONFIG_VDSO=n" >> .config
          echo "CONFIG_VDSO32=n" >> .config

      - name: Build kernel Image.gz
        run: |
          make -j$(nproc) Image.gz ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 2>&1 | tail -30

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image-gz
          path: arch/arm64/boot/Image.gz
          retention-days: 7

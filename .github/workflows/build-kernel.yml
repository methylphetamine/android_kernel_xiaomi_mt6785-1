name: Build Kernel (Final Solution - Correct Toolchain)

on:
  push:
    branches: [ fifteen ]
  pull_request:
    branches: [ fifteen ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip git gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Install Clang Toolchain
        run: |
          # Install the pre-built Clang toolchain that supports aarch64-linux-gnu target
          # This is the key to fixing the MT6785 kernel build
          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.0/clang+llvm-18.1.0-aarch64-linux-gnu-ubuntu-22.04.tar.xz
          tar -xf clang+llvm-18.1.0-aarch64-linux-gnu-ubuntu-22.04.tar.xz
          cd clang+llvm-18.1.0-aarch64-linux-gnu-ubuntu-22.04
          sudo mv bin/clang /usr/local/bin/aarch64-linux-gnu-clang
          cd ..
          rm -rf clang+llvm-18.1.0-aarch64-linux-gnu-ubuntu-22.04
          rm -f clang+llvm-18.1.0-aarch64-linux-gnu-ubuntu-22.04.tar.xz

      - name: Verify Toolchain
        run: |
          # Verify the installed Clang toolchain
          echo "Installed Clang version:"
          aarch64-linux-gnu-clang --version | head -1
          echo ""
          
          # Test aarch64-linux-gnu target support
          echo "Testing aarch64-linux-gnu target support..."
          if ! aarch64-linux-gnu-clang --target=aarch64-linux-gnu -v >/dev/null 2>&1; then
            echo "ERROR: Installed Clang does not support aarch64-linux-gnu target"
            echo "This is required for MT6785 kernel build"
            exit 1
          fi
          
          echo "✅ Clang toolchain verified successfully"
          echo "Clang supports aarch64-linux-gnu target"

      - name: Build Kernel
        run: |
          cd /tmp/kernel_fix
          echo "Starting MT6785 kernel build with verified toolchain..."
          echo "Using Clang from: $(which aarch64-linux-gnu-clang)"
          echo "Clang version: $(aarch64-linux-gnu-clang --version | head -1)"
          
          # Set up environment with correct toolchain
          export CC="aarch64-linux-gnu-clang"
          export CXX="aarch64-linux-gnu-clang++"
          export AR="aarch64-linux-gnu-ar"
          export LD="aarch64-linux-gnu-ld"
          export AS="aarch64-linux-gnu-as"
          export NM="aarch64-linux-gnu-nm"
          
          # Run the build script
          ./build.sh

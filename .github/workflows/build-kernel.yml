name: Build MT6785 Kernel

on:
  workflow_dispatch:
  push:
    branches: [ fifteen ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: fifteen

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev \
            libncursesw5-dev xz-utils tar curl wget git make gcc g++ libelf-dev \
            python3 python3-pip rsync

      - name: Download Android NDK r25b (clang 14)
        run: |
          cd /tmp
          wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip -O ndk.zip
          unzip -q ndk.zip -d /opt
          echo "NDK=/opt/android-ndk-r25b" >> $GITHUB_ENV
          echo "/opt/android-ndk-r25b/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Generate kernel config
        run: |
          sed -i 's/^CONFIG_VDSO=.*/CONFIG_VDSO=n/' arch/arm64/configs/begonia_user_defconfig 2>/dev/null || true
          grep -q '^CONFIG_VDSO=' arch/arm64/configs/begonia_user_defconfig || echo 'CONFIG_VDSO=n' >> arch/arm64/configs/begonia_user_defconfig
          sed -i 's/^CONFIG_VDSO32=.*/CONFIG_VDSO32=n/' arch/arm64/configs/begonia_user_defconfig 2>/dev/null || true
          grep -q '^CONFIG_VDSO32=' arch/arm64/configs/begonia_user_defconfig || echo 'CONFIG_VDSO32=n' >> arch/arm64/configs/begonia_user_defconfig
          sed -i '/vdso/d' arch/arm64/Makefile
          rm -rf arch/arm64/kernel/vdso
          mkdir -p arch/arm64/kernel/vdso
          echo 'obj-y :=' > arch/arm64/kernel/vdso/Makefile
          echo 'obj-m :=' >> arch/arm64/kernel/vdso/Makefile
          make begonia_user_defconfig ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- CC=clang CLANG_TRIPLE=aarch64-linux-android LLVM=1 2>&1 | tail -5 || true
          scripts/config --disable COMPAT 2>/dev/null || true
          scripts/config --disable CC_STACKPROTECTOR_STRONG 2>/dev/null || true
          scripts/config --disable CC_STACKPROTECTOR 2>/dev/null || true
          make olddefconfig ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- CC=clang CLANG_TRIPLE=aarch64-linux-android LLVM=1 2>&1 | tail -5

      - name: Build kernel Image.gz
        run: |
          make -j$(nproc) Image.gz ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- CC=clang CLANG_TRIPLE=aarch64-linux-android LLVM=1 2>&1
          ls -la arch/arm64/boot/

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image-gz
          path: arch/arm64/boot/Image.gz
          retention-days: 7
